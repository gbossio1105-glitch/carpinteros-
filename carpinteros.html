const uid = (p) => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);

function fmtFechaCorta(iso){
  const d = new Date(iso);
  const hoy = new Date();
  const ayer = new Date(); ayer.setDate(hoy.getDate()-1);
  const mismoDia = (a,b) => a.toDateString() === b.toDateString();
  if(mismoDia(d, hoy)) return "hoy";
  if(mismoDia(d, ayer)) return "ayer";
  return d.toLocaleDateString("es-AR", {day:"2-digit", month:"2-digit", year:"numeric"});
}
function fmtFechaCompleta(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("es-AR", {day:"2-digit", month:"2-digit", year:"numeric"}) + " " + d.toLocaleTimeString("es-AR", {hour:"2-digit", minute:"2-digit"});
}

// Esperamos hasta que el script de módulo (arriba en el head) haya terminado
// de inicializar Firebase y expuesto las funciones en window.
function esperarFirebase(){
  return new Promise((resolve)=>{
    if(window.__firestoreReady) return resolve();
    const intervalo = setInterval(()=>{
      if(window.__firestoreReady){
        clearInterval(intervalo);
        resolve();
      }
    }, 50);
  });
}

// El documento único donde guardamos toda la base (simple y suficiente para
// nuestro volumen de datos). Colección "carpinteros_app", documento "datos".
async function storageGet(key){
  try{
    await esperarFirebase();
    const ref = window.__firestoreDoc(window.__firestoreDb, "carpinteros_app", key);
    const snap = await window.__firestoreGetDoc(ref);
    if(snap.exists()){
      const datos = snap.data();
      // Guardamos también una copia local como respaldo offline.
      try{ window.localStorage.setItem(key, JSON.stringify(datos)); }catch(e){}
      return datos;
    }
    // Si no hay nada en Firestore todavía, probamos con la copia local vieja
    // (por si el usuario ya tenía datos guardados antes de esta migración).
    const raw = window.localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    console.error("storage get error (usando copia local si existe)", key, e);
    try{
      const raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    }catch(e2){ return null; }
  }
}

  // Guardamos localmente primero, así la app sigue funcionando aunque no haya
  // internet en ese momento.
  try{ window.localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
  try{
    await esperarFirebase();
    const ref = window.__firestoreDoc(window.__firestoreDb, "carpinteros_app", key);
    await window.__firestoreSetDoc(ref, value);
    return true;
  }catch(e){
    console.error("storage set error (Firestore) — quedó guardado solo local por ahora", key, e);
    return false;
  }
}

// Suscribe una función que se ejecuta cada vez que los datos cambian en
// Firestore (incluyendo cambios hechos desde OTRO dispositivo). Devuelve una
// función para cancelar la suscripción.
function suscribirseACambios(key, callback){
  let cancelado = false;
  let unsubscribe = null;
  esperarFirebase().then(()=>{
    if(cancelado) return;
    const ref = window.__firestoreDoc(window.__firestoreDb, "carpinteros_app", key);
    unsubscribe = window.__firestoreOnSnapshot(ref, (snap)=>{
      if(snap.exists()) callback(snap.data());
    });
  });
  return ()=>{ cancelado = true; if(unsubscribe) unsubscribe(); };
}

// Determina la "etapa de contacto" de un carpintero según el comentario del
// evento más reciente (los que se registran automáticamente al enviar mensajes
// desde Primer contacto empiezan con "Primer/Segundo/Tercer contacto —").
const ETAPAS_CONTACTO = ["Primer contacto", "Segundo contacto", "Tercer contacto"];

function etapaContactoDe(carpintero){
  const eventos = carpintero.eventos || [];
  for(const ev of eventos){ // ya vienen ordenados con el más reciente primero
    if(!ev.comentario) continue;
    const encontrada = ETAPAS_CONTACTO.find(e => ev.comentario.startsWith(e));
    if(encontrada) return encontrada;
  }
  return "Sin contacto";
}

// Determina la clasificación manual más reciente (Compró o Pidió presupuesto)
// ignorando los eventos automáticos de "WhatsApp enviado". Devuelve null si
// nunca se tildó ninguna de las dos.
function clasificacionManualDe(carpintero){
  const eventos = carpintero.eventos || [];
  const ev = eventos.find(e => e.tipo !== "whatsapp");
  return ev ? ev.tipo : null;
}

// Determina la clasificación combinada: si hay una manual (Compró / Pidió
// presupuesto), esa tiene prioridad. Si no, se infiere automáticamente según
// hasta qué etapa de mensajes se avanzó: si ya hay algún mensaje de "Segundo
// contacto" o posterior, el carpintero contestó (si no, no pudo haber
// avanzado esa etapa). Si solo hay mensajes de "Primer contacto", todavía no
// sabemos si contestó o no.
function clasificacionDe(carpintero){
  const manual = clasificacionManualDe(carpintero);
  if(manual) return manual;

  const etapa = etapaContactoDe(carpintero);
  if(etapa === "Sin contacto") return null;
  if(etapa === "Primer contacto") return CLASIFICACION_AUTO.NO_CONTESTO.id;
  return CLASIFICACION_AUTO.CONTESTO.id; // Segundo o Tercer contacto ya alcanzados
}

// Fecha del evento más reciente relevante para calcular "hace cuánto no hay
// novedades" (cualquier evento cuenta, no solo los manuales).
function fechaUltimoMovimiento(carpintero){
  const eventos = carpintero.eventos || [];
  if(eventos.length > 0) return eventos[0].fecha;
  return carpintero.fechaAgregado || null;
}

// Calcula si corresponde mostrar la alerta de "hace mucho sin novedades" para
// este carpintero, según su clasificación actual y el umbral de días que le
// corresponde. Devuelve {alerta:boolean, dias:number|null}.
function alertaSeguimientoDe(carpintero){
  const clasificacion = clasificacionDe(carpintero);
  const clave = clasificacion || "sin_contacto";
  const umbral = DIAS_ALERTA_POR_CLASIFICACION[clave];
  if(umbral === undefined) return {alerta:false, dias:null}; // "Compró" con id distinto, etc.

  const fecha = fechaUltimoMovimiento(carpintero);
  if(!fecha) return {alerta:false, dias:null};

  const dias = Math.floor((Date.now() - new Date(fecha).getTime()) / (1000*60*60*24));
  return {alerta: dias >= umbral, dias};
}

// Convierte un texto de teléfono viejo (posiblemente con varios números pegados
// por guiones o espacios, en formato área-número repetido) en una lista de
// teléfonos [{id, nombre, numero}]. Reconstruye "código de área + número local"
// cuando detecta un grupo corto (el área) seguido de uno o más números cortos
// que la comparten.
function separarTelefonos(texto){
  if(!texto || !texto.trim()) return [];
  const grupos = texto.match(/\d+/g) || [];
  if(grupos.length === 0) return [];

  const numeros = [];
  let i = 0;
  while(i < grupos.length){
    const g = grupos[i];
    if(g.length >= 10){
      numeros.push(g);
      i++;
    } else if(g.length <= 4 && i+1 < grupos.length){
      const area = g;
      i++;
      let sumoAlguno = false;
      while(i < grupos.length && grupos[i].length >= 5 && grupos[i].length <= 7){
        numeros.push(area + grupos[i]);
        i++;
        sumoAlguno = true;
      }
      if(!sumoAlguno) numeros.push(area); // caso raro: área suelta sin número asociado
    } else {
      if(g.length >= 4) numeros.push(g);
      i++;
    }
  }
  const unicos = [...new Set(numeros)];
  return unicos.map(n => ({ id: uid("tel"), nombre:"", numero:n }));
}

    return {...resto, id: uid("carp"), eventos: [], telefonos: separarTelefonos(telefono), fechaAgregado: ahora};
  });
  return { carpinteros };
}

        let carpinterosMigrados = data.carpinteros.map(c=>{

            return {...c, ruta: "San Francisco"};

        });

        // Migración 5: limpiamos el código postal que algunas localidades
        // guardadas todavía tienen al inicio (ej: "2434 ARROYITO" -> "ARROYITO"),
        // y unificamos mayúsculas/minúsculas, para que el filtro de localidad
        // no muestre la misma localidad repetida con formatos distintos.
        carpinterosMigrados = carpinterosMigrados.map(c=>{
          const localidadOriginal = c.localidad || "";

          if(localidadLimpia !== localidadOriginal){
            huboMigracion = true;

            return {...resto, id: uid("carp"), eventos: [], telefonos: separarTelefonos(telefono), fechaAgregado: ahoraMigracion6};
          });

          data = {...data, carpinteros: carpinterosMigrados};

    const nuevos = db.carpinteros.map(c=>{
      if(!idsSeleccionados.has(c.id)) return c;
      const eventos = c.eventos || [];
      const evento = {...eventoBase, id: uid("ev")};
      return {...c, eventos: [evento, ...eventos]};
    });
    await guardarDb({...db, carpinteros: nuevos});
    mostrarToast(`Evento registrado en ${idsSeleccionados.size} carpinteros`);
    setSeleccionados(new Set());
    setModoSeleccion(false);
    setModalEventoMasivo(false);
  }

  function alternarSeleccion(id){
    setSeleccionados(prev=>{
      const next = new Set(prev);
      if(next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }

  function seleccionarTodosFiltrados(){
    setSeleccionados(new Set(carpinterosFiltrados.map(c=>c.id)));
  }

  function limpiarSeleccion(){
    setSeleccionados(new Set());
  }

  const localidades = useMemo(()=>{
    if(!db) return [];
    const base = filtroRuta==="todas"
      ? db.carpinteros
      : db.carpinteros.filter(c=> (c.ruta||"Sin especificar")===filtroRuta);
    return ["todas", ...new Set(base.map(c=>c.localidad).filter(Boolean))].sort();
  }, [db, filtroRuta]);

  useEffect(()=>{
    if(filtroLocalidad!=="todas" && !localidades.includes(filtroLocalidad)){
      setFiltroLocalidad("todas");
    }
  }, [localidades, filtroLocalidad]);

  const comentariosUnicos = useMemo(()=>{
    if(!db) return [];
    const set = new Set();
    db.carpinteros.forEach(c=>{
      (c.eventos||[]).forEach(ev=>{
        if(ev.comentario && ev.comentario.trim()) set.add(ev.comentario.trim());
      });
    });
    return [...set].sort((a,b)=> a.localeCompare(b, 'es'));
  }, [db]);

  const carpinterosFiltrados = useMemo(()=>{
    if(!db) return [];
    let lista = db.carpinteros.filter(c=>{
      if(filtroLocalidad!=="todas" && c.localidad!==filtroLocalidad) return false;
      if(filtroRuta!=="todas" && (c.ruta||"Sin especificar")!==filtroRuta) return false;
      if(filtroEtapaContacto!=="todas" && etapaContactoDe(c)!==filtroEtapaContacto) return false;
      if(filtroClasificacion!=="todas" && clasificacionDe(c)!==filtroClasificacion) return false;
      if(busqueda){
        const q = busqueda.toLowerCase();
        const telefonosTexto = (c.telefonos||[]).map(t=>t.numero+" "+(t.nombre||"")).join(" ").toLowerCase();
        return c.nombre.toLowerCase().includes(q) || (c.localidad||"").toLowerCase().includes(q) || telefonosTexto.includes(q);
      }
      return true;
    });
    if(orden==="nombre") lista = [...lista].sort((a,b)=> a.nombre.localeCompare(b.nombre));
    if(orden==="localidad") lista = [...lista].sort((a,b)=> (a.localidad||"").localeCompare(b.localidad||""));
    if(orden==="ruta") lista = [...lista].sort((a,b)=> (a.ruta||"Sin especificar").localeCompare(b.ruta||"Sin especificar"));
    if(orden==="ultimo_contacto") lista = [...lista].sort((a,b)=>{
      const fa = (a.eventos||[])[0]?.fecha || "0";
      const fb = (b.eventos||[])[0]?.fecha || "0";
      return fb.localeCompare(fa);
    });
    return lista;
  }, [db, busqueda, filtroLocalidad, filtroRuta, filtroEtapaContacto, filtroClasificacion, orden]);

  // Cantidades para mostrar junto a cada opción de los filtros de "Etapa de
  // contacto" y "Clasificación", calculadas sobre lo que está filtrado en
  // este momento (respetando los demás filtros ya aplicados).
  const conteoEtapas = useMemo(()=>{
    const contadores = {"Sin contacto":0, "Primer contacto":0, "Segundo contacto":0, "Tercer contacto":0};
    carpinterosFiltrados.forEach(c=>{
      const etapa = etapaContactoDe(c);
      if(contadores[etapa] !== undefined) contadores[etapa]++;
    });
    return contadores;
  }, [carpinterosFiltrados]);

  const conteoClasificaciones = useMemo(()=>{
    const contadores = {compro:0, pidio_presupuesto:0, contesto_auto:0, no_contesto_auto:0};
    carpinterosFiltrados.forEach(c=>{
      const clasificacion = clasificacionDe(c);
      if(clasificacion && contadores[clasificacion] !== undefined) contadores[clasificacion]++;
    });
    return contadores;
  }, [carpinterosFiltrados]);

  if(cargando || !db){
    return (
      <div style={{display:"flex", alignItems:"center", justifyContent:"center", height:"100vh", flexDirection:"column", gap:12}}>
        <div style={{width:36, height:36, border:"3px solid var(--azul-100)", borderTopColor:"var(--azul-600)", borderRadius:"50%", animation:"spin 0.8s linear infinite"}}></div>
        <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
        <div style={{color:"var(--gris-500)", fontSize:14}}>Cargando...</div>
      </div>
    );
  }

  const totalCarpinteros = db.carpinteros.length;
  const contactados = db.carpinteros.filter(c=>(c.eventos||[]).length>0).length;

  return (
    <div style={{minHeight:"100vh", background:"var(--gris-50)"}}>
      <header style={{background:"var(--azul-900)", color:"#fff", padding:"18px 20px"}}>
        <div style={{fontWeight:800, fontSize:19}}>Carpinteros <span style={{color:"#7fb4ea"}}>Clientes</span></div>
        <div style={{fontSize:12.5, color:"rgba(255,255,255,0.65)", marginTop:2}}>
          {totalCarpinteros} carpinteros · {contactados} con seguimiento cargado
        </div>
      </header>

      <main style={{padding:"18px 16px", maxWidth:720, margin:"0 auto"}}>
        <div style={{display:"flex", gap:8, marginBottom:14, flexWrap:"wrap"}}>
          <input placeholder="Buscar nombre, localidad o teléfono..." value={busqueda} onChange={e=>setBusqueda(e.target.value)}
            style={{flex:"1 1 180px", padding:"10px 12px", borderRadius:8, border:"1px solid var(--gris-300)", fontSize:14}} />
          <button onClick={()=>{setEditando(null); setModalAbierto(true);}}
            style={{padding:"10px 16px", borderRadius:8, border:"none", background:"var(--azul-600)", color:"#fff", fontSize:14, fontWeight:600, whiteSpace:"nowrap"}}>
            + Carpintero
          </button>
          <button onClick={()=>{ if(modoSeleccion){ limpiarSeleccion(); } setModoSeleccion(m=>!m); }}
            style={{padding:"10px 16px", borderRadius:8, border: modoSeleccion ? "none" : "1px solid var(--azul-500)",
              background: modoSeleccion ? "var(--rojo-600)" : "#fff", color: modoSeleccion ? "#fff" : "var(--azul-600)",
              fontSize:14, fontWeight:600, whiteSpace:"nowrap"}}>
            {modoSeleccion ? "✕ Cancelar selección" : "☑ Selección masiva"}
          </button>
        </div>

        <div style={{display:"flex", gap:8, marginBottom:14, flexWrap:"wrap"}}>
          <button onClick={exportarBackup}
            style={{padding:"8px 14px", borderRadius:8, border:"1px solid var(--gris-300)", background:"#fff", color:"var(--gris-700)", fontSize:12.5, fontWeight:600, whiteSpace:"nowrap"}}>
            ⬇️ Exportar backup
          </button>
          <label style={{padding:"8px 14px", borderRadius:8, border:"1px solid var(--gris-300)", background:"#fff", color:"var(--gris-700)", fontSize:12.5, fontWeight:600, whiteSpace:"nowrap", cursor:"pointer", display:"inline-block"}}>
            ⬆️ Importar backup
            <input type="file" accept="application/json" style={{display:"none"}}
              onChange={e=>{ if(e.target.files[0]) importarBackup(e.target.files[0]); e.target.value=""; }} />
          </label>
        </div>

        <div style={{display:"flex", gap:8, marginBottom:16, flexWrap:"wrap"}}>
          <select value={filtroRuta} onChange={e=>setFiltroRuta(e.target.value)} style={{flex:"1 1 140px", padding:"8px 10px", borderRadius:8, border:"1px solid var(--gris-300)", fontSize:13}}>
            <option value="todas">Todas las rutas</option>
            {RUTAS_ACCESO.map(r=> <option key={r} value={r}>{r}</option>)}
            <option value="Sin especificar">Sin especificar</option>
          </select>
          <select value={filtroLocalidad} onChange={e=>setFiltroLocalidad(e.target.value)} style={{flex:"1 1 140px", padding:"8px 10px", borderRadius:8, border:"1px solid var(--gris-300)", fontSize:13}}>
            {localidades.map(l=> <option key={l} value={l}>{l==="todas" ? "Todas las localidades" : l}</option>)}
          </select>
          <select value={filtroEtapaContacto} onChange={e=>setFiltroEtapaContacto(e.target.value)} style={{flex:"1 1 140px", padding:"8px 10px", borderRadius:8, border:"1px solid var(--gris-300)", fontSize:13}}>
            <option value="todas">Todos los contactos</option>
            <option value="Sin contacto">Sin contacto ({conteoEtapas["Sin contacto"]})</option>
            <option value="Primer contacto">Primer contacto ({conteoEtapas["Primer contacto"]})</option>
            <option value="Segundo contacto">Segundo contacto ({conteoEtapas["Segundo contacto"]})</option>
            <option value="Tercer contacto">Tercer contacto ({conteoEtapas["Tercer contacto"]})</option>
          </select>
          <select value={filtroClasificacion} onChange={e=>setFiltroClasificacion(e.target.value)} style={{flex:"1 1 140px", padding:"8px 10px", borderRadius:8, border:"1px solid var(--gris-300)", fontSize:13}}>
            <option value="todas">Todas las clasificaciones</option>
            {TIPOS_EVENTO.filter(t=>t.id!=="whatsapp").map(t=> <option key={t.id} value={t.id}>{t.label} ({conteoClasificaciones[t.id]||0})</option>)}
            {Object.values(CLASIFICACION_AUTO).map(t=> <option key={t.id} value={t.id}>{t.label} (auto) ({conteoClasificaciones[t.id]||0})</option>)}
          </select>
          <select value={orden} onChange={e=>setOrden(e.target.value)} style={{flex:"1 1 140px", padding:"8px 10px", borderRadius:8, border:"1px solid var(--gris-300)", fontSize:13}}>
            <option value="nombre">Nombre (A-Z)</option>
            <option value="localidad">Localidad (A-Z)</option>
            <option value="ruta">Ruta de acceso</option>
            <option value="ultimo_contacto">Último contacto</option>
          </select>
        </div>

        {modoSeleccion && (
          <div style={{display:"flex", gap:10, alignItems:"center", marginBottom:14, fontSize:13}}>
            <span style={{color:"var(--gris-700)", fontWeight:600}}>{seleccionados.size} seleccionados</span>
            <button onClick={seleccionarTodosFiltrados} style={{background:"none", border:"none", color:"var(--azul-600)", fontWeight:600, padding:0}}>
              Seleccionar los {carpinterosFiltrados.length} filtrados
            </button>
            <button onClick={limpiarSeleccion} style={{background:"none", border:"none", color:"var(--gris-500)", padding:0}}>
              Ninguno
            </button>
          </div>
        )}

        {carpinterosFiltrados.length===0 ? (
          <div style={{textAlign:"center", padding:"40px 20px", color:"var(--gris-500)", fontSize:14}}>
            {db.carpinteros.length===0 ? "Todavía no cargaste ningún carpintero." : "No hay carpinteros que coincidan con el filtro."}
          </div>
        ) : (
          <div style={{overflowX:"auto", border:"1px solid var(--gris-100)", borderRadius:12, background:"#fff"}}>
            <table style={{width:"100%", borderCollapse:"collapse", fontSize:13}}>
              <thead>
                <tr style={{background:"var(--gris-50)", borderBottom:"1px solid var(--gris-100)"}}>
                  {modoSeleccion && <th style={{padding:"8px 6px", width:30}}></th>}
                  <th style={{padding:"8px 10px", textAlign:"left", fontWeight:700, whiteSpace:"nowrap"}}>Nombre</th>
                  <th style={{padding:"8px 10px", textAlign:"left", fontWeight:700, whiteSpace:"nowrap"}}>Localidad</th>
                  <th style={{padding:"8px 10px", textAlign:"left", fontWeight:700, whiteSpace:"nowrap"}}>Teléfono</th>
                  {!columnasOcultas.has("ruta") && (
                    <th style={{padding:"8px 10px", textAlign:"left", fontWeight:700, whiteSpace:"nowrap"}}>
                      Ruta <button onClick={()=>setColumnasOcultas(prev=>new Set(prev).add("ruta"))} style={{background:"none", border:"none", color:"var(--gris-500)", fontWeight:700, padding:"0 2px", cursor:"pointer"}}>✕</button>
                    </th>
                  )}
                  {!columnasOcultas.has("clasificacion") && (
                    <th style={{padding:"8px 10px", textAlign:"left", fontWeight:700, whiteSpace:"nowrap"}}>
                      Clasificación <button onClick={()=>setColumnasOcultas(prev=>new Set(prev).add("clasificacion"))} style={{background:"none", border:"none", color:"var(--gris-500)", fontWeight:700, padding:"0 2px", cursor:"pointer"}}>✕</button>
                    </th>
                  )}
                  {!columnasOcultas.has("etapa") && (
                    <th style={{padding:"8px 10px", textAlign:"left", fontWeight:700, whiteSpace:"nowrap"}}>
                      Etapa <button onClick={()=>setColumnasOcultas(prev=>new Set(prev).add("etapa"))} style={{background:"none", border:"none", color:"var(--gris-500)", fontWeight:700, padding:"0 2px", cursor:"pointer"}}>✕</button>
                    </th>
                  )}
                  {!columnasOcultas.has("ultimoEvento") && (
                    <th style={{padding:"8px 10px", textAlign:"left", fontWeight:700, whiteSpace:"nowrap"}}>
                      Último evento <button onClick={()=>setColumnasOcultas(prev=>new Set(prev).add("ultimoEvento"))} style={{background:"none", border:"none", color:"var(--gris-500)", fontWeight:700, padding:"0 2px", cursor:"pointer"}}>✕</button>
                    </th>
                  )}
                  {!columnasOcultas.has("alertas") && (
                    <th style={{padding:"8px 10px", textAlign:"left", fontWeight:700, whiteSpace:"nowrap"}}>
                      Alertas <button onClick={()=>setColumnasOcultas(prev=>new Set(prev).add("alertas"))} style={{background:"none", border:"none", color:"var(--gris-500)", fontWeight:700, padding:"0 2px", cursor:"pointer"}}>✕</button>
                    </th>
                  )}
                </tr>
              </thead>
              <tbody>
                {carpinterosFiltrados.map(c=>{
                  const clasificacionManual = (c.eventos||[]).find(e=>e.tipo!=="whatsapp");
                  const clasificacionAutoId = !clasificacionManual ? clasificacionDe(c) : null;
                  const clasificacionAuto = clasificacionAutoId ? Object.values(CLASIFICACION_AUTO).find(x=>x.id===clasificacionAutoId) : null;
                  const etiquetaClasificacion = clasificacionManual ? labelEvento(clasificacionManual.tipo) : (clasificacionAuto ? clasificacionAuto.label+" (auto)" : "—");
                  const colorClasificacion = clasificacionManual ? colorEvento(clasificacionManual.tipo) : (clasificacionAuto ? colorEvento(clasificacionAuto.id) : null);
                  const etapa = etapaContactoDe(c);
                  const ultimoEvento = (c.eventos||[])[0];
                  const {alerta, dias} = alertaSeguimientoDe(c);
                  const primerTel = (c.telefonos||[])[0];
                  return (
                    <tr key={c.id} onClick={()=>setCarpinteroDetalle(c)}
                      style={{borderBottom:"1px solid var(--gris-100)", cursor:"pointer",
                        background: modoSeleccion && seleccionados.has(c.id) ? "var(--azul-50)" : "transparent"}}>
                      {modoSeleccion && (
                        <td style={{padding:"8px 6px"}} onClick={e=>e.stopPropagation()}>
                          <input type="checkbox" checked={seleccionados.has(c.id)} onChange={()=>alternarSeleccion(c.id)} style={{width:18, height:18}} />
                        </td>
                      )}
                      <td style={{padding:"8px 10px", fontWeight:600, whiteSpace:"nowrap"}}>{c.nombre}</td>
                      <td style={{padding:"8px 10px", color:"var(--gris-600)", whiteSpace:"nowrap"}}>{c.localidad || "—"}</td>
                      <td style={{padding:"8px 10px", whiteSpace:"nowrap"}}>
                        {primerTel ? (primerTel.sinWhatsapp ? `📵 ${primerTel.numero}` : primerTel.numero) : "—"}
                      </td>
                      {!columnasOcultas.has("ruta") && <td style={{padding:"8px 10px", color:"var(--gris-600)", whiteSpace:"nowrap"}}>{c.ruta || "—"}</td>}
                      {!columnasOcultas.has("clasificacion") && (
                        <td style={{padding:"8px 10px", whiteSpace:"nowrap"}}>
                          {colorClasificacion ? (
                            <span style={{fontSize:10.5, padding:"2px 8px", borderRadius:20, fontWeight:700, background:colorClasificacion.bg, color:colorClasificacion.fg}}>
                              {etiquetaClasificacion}
                            </span>
                          ) : "—"}
                        </td>
                      )}
                      {!columnasOcultas.has("etapa") && <td style={{padding:"8px 10px", color:"var(--gris-600)", whiteSpace:"nowrap"}}>{etapa}</td>}
                      {!columnasOcultas.has("ultimoEvento") && (
                        <td style={{padding:"8px 10px", color:"var(--gris-600)", whiteSpace:"nowrap"}}>
                          {ultimoEvento ? fmtFechaCorta(ultimoEvento.fecha) : "—"}
                        </td>
                      )}
                      {!columnasOcultas.has("alertas") && (
                        <td style={{padding:"8px 10px", whiteSpace:"nowrap"}}>
                          {alerta ? <span style={{color:"var(--rojo-600)", fontWeight:700, fontSize:12}}>⏰ {dias}d</span> : "—"}
                        </td>
                      )}
                    </tr>
                  );
                })}
              </tbody>
            </table>
            {columnasOcultas.size > 0 && (
              <div style={{padding:"10px", borderTop:"1px solid var(--gris-100)"}}>
                <button onClick={()=>setColumnasOcultas(new Set())}
                  style={{fontSize:12.5, color:"var(--azul-600)", background:"none", border:"1px dashed var(--azul-500)", borderRadius:7, padding:"6px 12px"}}>
                  + Agregar columna ({columnasOcultas.size} oculta{columnasOcultas.size>1?"s":""})
                </button>
              </div>
            )}
          </div>
        )}
      </main>

      {modoSeleccion && seleccionados.size>0 && (
        <div style={{position:"fixed", bottom:0, left:0, right:0, background:"var(--azul-900)", padding:"12px 16px", display:"flex", alignItems:"center", justifyContent:"space-between", gap:8, zIndex:60, boxShadow:"0 -4px 16px rgba(0,0,0,0.15)", flexWrap:"wrap"}}>
          <span style={{color:"#fff", fontSize:14, fontWeight:600}}>{seleccionados.size} seleccionados</span>
          <div style={{display:"flex", gap:8}}>
            <button onClick={()=>setEnvioMasivoAbierto(true)}
              style={{padding:"10px 14px", borderRadius:8, border:"none", background:"var(--verde-600)", color:"#fff", fontWeight:700, fontSize:13.5, whiteSpace:"nowrap"}}>
              📨 Enviar mensajes
            </button>
            <button onClick={()=>setModalEventoMasivo(true)}
              style={{padding:"10px 14px", borderRadius:8, border:"none", background:"var(--azul-600)", color:"#fff", fontWeight:700, fontSize:13.5, whiteSpace:"nowrap"}}>
              Aplicar evento
            </button>
          </div>
        </div>
      )}

      {modalAbierto && (
        <ModalCarpintero carpintero={editando} onGuardar={guardarCarpintero} onCerrar={()=>{setModalAbierto(false); setEditando(null);}} />
      )}

      {carpinteroEventos && (
        <ModalEventos
          carpintero={db.carpinteros.find(c=>c.id===carpinteroEventos.id) || carpinteroEventos}
          onAgregar={(ev)=>agregarEvento(carpinteroEventos.id, ev)}
          onEliminar={(evId)=>eliminarEvento(carpinteroEventos.id, evId)}
          onCerrar={()=>setCarpinteroEventos(null)}
          comentariosPrevios={comentariosUnicos}
        />
      )}

      {modalEventoMasivo && (
        <ModalEventoMasivo
          cantidad={seleccionados.size}
          onAplicar={agregarEventoMasivo}
          onCerrar={()=>setModalEventoMasivo(false)}
          comentariosPrevios={comentariosUnicos}
        />
      )}

      {envioMasivoAbierto && (
        <ModalEnvioMasivo
          carpinteros={db.carpinteros.filter(c=>seleccionados.has(c.id))}
          onRegistrarEnvio={agregarEvento}
          onCerrar={()=>setEnvioMasivoAbierto(false)}
        />
      )}

      {carpinteroPrimerContacto && (
        <ModalPrimerContacto
          carpintero={db.carpinteros.find(c=>c.id===carpinteroPrimerContacto.id) || carpinteroPrimerContacto}
          onCerrar={()=>setCarpinteroPrimerContacto(null)}
          onRegistrarEnvio={(evento)=>agregarEvento(carpinteroPrimerContacto.id, evento)}
          onMarcarDatosCompletos={(valor)=>actualizarCampoCarpintero(carpinteroPrimerContacto.id, "datosCompletos", valor)}
        />
      )}

      {carpinteroDetalle && (
        <ModalDetalleCarpintero
          carpintero={db.carpinteros.find(c=>c.id===carpinteroDetalle.id) || carpinteroDetalle}
          onCerrar={()=>setCarpinteroDetalle(null)}
          onAgregarEvento={agregarEvento}
          onMarcarSinWhatsapp={marcarSinWhatsapp}
          onAbrirPrimerContacto={(c)=>{setCarpinteroDetalle(null); setCarpinteroPrimerContacto(c);}}
          onAbrirSeguimiento={(c)=>{setCarpinteroDetalle(null); setCarpinteroEventos(c);}}
          onEditar={(c)=>{setCarpinteroDetalle(null); setEditando(c); setModalAbierto(true);}}
          onEliminar={(id)=>{setCarpinteroDetalle(null); eliminarCarpintero(id);}}
        />
      )}

      {toast && (
        <div style={{position:"fixed", bottom:24, left:"50%", transform:"translateX(-50%)", background:"var(--verde-600)", color:"#fff", padding:"11px 20px", borderRadius:10, boxShadow:"0 8px 24px rgba(0,0,0,0.2)", fontSize:14, zIndex:100}}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

function ModalDetalleCarpintero({carpintero, onCerrar, onAgregarEvento, onMarcarSinWhatsapp, onAbrirPrimerContacto, onAbrirSeguimiento, onEditar, onEliminar}){
  const c = carpintero;
  const clasificacionManual = (c.eventos||[]).find(e=>e.tipo!=="whatsapp");
  const clasificacionAutoId = !clasificacionManual ? clasificacionDe(c) : null;
  const clasificacionAuto = clasificacionAutoId ? Object.values(CLASIFICACION_AUTO).find(x=>x.id===clasificacionAutoId) : null;
  const ultimoWhatsapp = (c.eventos||[]).find(e=>e.tipo==="whatsapp");
  const {alerta, dias} = alertaSeguimientoDe(c);

  return (
    <div className="modal-overlay" style={{position:"fixed", inset:0, background:"rgba(10,20,35,0.5)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:65, padding:16}} onClick={onCerrar}>
      <div className="modal-box" style={{background:"#fff", borderRadius:14, padding:"20px 18px", width:460, maxWidth:"100%", maxHeight:"90vh", overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <div style={{fontWeight:700, fontSize:16}}>{c.nombre}</div>
        <div style={{fontSize:12.5, color:"var(--gris-500)", marginTop:3}}>
          {c.localidad && <span>{c.localidad}{c.provincia ? ", "+c.provincia : ""}</span>}
        </div>
        {c.ruta && (

function ModalCarpintero({carpintero, onGuardar, onCerrar}){
  const [form, setForm] = useState(carpintero || {
    id: uid("carp"), nombre:"", domicilio:"", localidad:"", provincia:"", telefonos:[], ruta:""
  });

  function actualizar(campo, valor){ setForm(f=>({...f, [campo]: valor})); }

  function actualizarTelefono(id, campo, valor){
    setForm(f=>({...f, telefonos: (f.telefonos||[]).map(t=> t.id===id ? {...t, [campo]:valor} : t)}));
  }

  function agregarTelefono(){
    setForm(f=>({...f, telefonos: [...(f.telefonos||[]), {id: uid("tel"), nombre:"", numero:""}]}));
  }

  function quitarTelefono(id){
    setForm(f=>({...f, telefonos: (f.telefonos||[]).filter(t=>t.id!==id)}));

  function confirmar(){
    if(!form.nombre.trim()){ alert("Ingresá el nombre del carpintero."); return; }
    const telefonosLimpios = (form.telefonos||[]).filter(t=>t.numero && t.numero.trim());

function ModalEventos({carpintero, onAgregar, onEliminar, onCerrar, comentariosPrevios}){
  const [tipo, setTipo] = useState(TIPOS_EVENTO[0].id);
  const [comentario, setComentario] = useState("");
  const [fecha, setFecha] = useState(()=>{
    const hoy = new Date();
    const yyyy = hoy.getFullYear();
    const mm = String(hoy.getMonth()+1).padStart(2,"0");
    const dd = String(hoy.getDate()).padStart(2,"0");
    return `${yyyy}-${mm}-${dd}`;
  });

  const eventos = carpintero.eventos || [];

  function agregar(){
    // Tomamos la fecha elegida (yyyy-mm-dd) y le sumamos la hora actual,
    // así el orden de "último contacto" sigue siendo preciso dentro del mismo día.
    const ahora = new Date();
    const [y,m,d] = fecha.split("-").map(Number);
    const fechaFinal = new Date(y, m-1, d, ahora.getHours(), ahora.getMinutes(), ahora.getSeconds());
    onAgregar({
      id: uid("ev"),
      fecha: fechaFinal.toISOString(),
      tipo,
      comentario: comentario.trim()
    });
    setComentario("");
  }

  return (
    <div className="modal-overlay" style={{position:"fixed", inset:0, background:"rgba(10,20,35,0.5)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:50, padding:16}} onClick={onCerrar}>
      <div className="modal-box" style={{background:"#fff", borderRadius:14, padding:"24px 22px", width:480, maxWidth:"100%", maxHeight:"90vh", overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <h3 style={{marginTop:0, fontSize:16, fontWeight:700, marginBottom:2}}>Seguimiento</h3>
        <p style={{fontSize:13, color:"var(--gris-500)", marginTop:0, marginBottom:16}}>{carpintero.nombre}</p>

        <div style={{background:"var(--gris-50)", borderRadius:10, padding:14, marginBottom:18}}>
          <Campo label="¿Qué pasó?">
            <select value={tipo} onChange={e=>setTipo(e.target.value)} style={inputStyle}>
              {TIPOS_EVENTO.map(t=> <option key={t.id} value={t.id}>{t.label}</option>)}
            </select>
          </Campo>
          <Campo label="Fecha">
            <input type="date" value={fecha} onChange={e=>setFecha(e.target.value)} style={inputStyle} />
          </Campo>
          <Campo label="Comentario (opcional)">
            <ComboComentario value={comentario} onChange={setComentario} comentariosPrevios={comentariosPrevios||[]} placeholder="Alguna nota sobre este contacto..." />
          </Campo>
          <button onClick={agregar} style={{width:"100%", padding:"9px", borderRadius:8, border:"none", background:"var(--verde-600)", color:"#fff", fontWeight:600, fontSize:13.5}}>
            + Registrar evento
          </button>
        </div>

        {eventos.length===0 ? (
          <div style={{textAlign:"center", padding:"20px 10px", color:"var(--gris-500)", fontSize:13}}>
            Todavía no registraste ningún contacto con este carpintero.
          </div>
        ) : (
          <div>
            <div style={{fontSize:12.5, fontWeight:600, color:"var(--gris-700)", marginBottom:8}}>Historial ({eventos.length})</div>
            {eventos.map(ev=>(
              <div key={ev.id} style={{borderBottom:"1px solid var(--gris-100)", padding:"10px 0"}}>
                <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8}}>
                  <div style={{flex:1, minWidth:0}}>
                    <span style={{fontSize:11, padding:"2px 8px", borderRadius:20, fontWeight:700,
                      background: colorEvento(ev.tipo).bg, color: colorEvento(ev.tipo).fg}}>
                      {labelEvento(ev.tipo)}
                    </span>
                    <div style={{fontSize:11.5, color:"var(--gris-500)", marginTop:4}}>{fmtFechaCompleta(ev.fecha)}</div>
                    {ev.comentario && <div style={{fontSize:13, color:"var(--gris-700)", marginTop:4}}>{ev.comentario}</div>}
                  </div>
                  <button onClick={()=>onEliminar(ev.id)} style={{background:"none", border:"none", color:"var(--rojo-600)", fontSize:12, padding:0, flexShrink:0}}>Eliminar</button>

        <div style={{marginTop:18}}>

function ModalPrimerContacto({carpintero, onCerrar, onRegistrarEnvio, onMarcarDatosCompletos}){
  const telefonos = carpintero.telefonos || [];
  const [telefonoElegido, setTelefonoElegido] = useState(telefonos[0]?.id || "");
  const [enviados, setEnviados] = useState(()=> new Set());
  const [etapa, setEtapa] = useState("primero"); // "primero" | "segundo" | "tercero" | "datos" | "viaje"
  const [modoViaje, setModoViaje] = useState("esta_semana");
  const [diasViaje, setDiasViaje] = useState([]);

  const telSeleccionado = telefonos.find(t=>t.id===telefonoElegido) || telefonos[0];

  // El saludo se calcula una sola vez al abrir el modal (no se recalcula en cada
  // render), combinado con los mensajes fijos de siempre.
  const mensajesPrimero = useMemo(()=> [
    {tipo:"whatsapp", texto: saludoSegunHora()},
    ...MENSAJES_PRIMER_CONTACTO,
  ], []);

  const mensajesViaje = useMemo(()=> [
    {tipo:"whatsapp", texto: saludoSegunHora()},
    {tipo:"whatsapp", texto: mensajeNotificacionViaje(modoViaje, diasViaje)},
  ], [modoViaje, diasViaje]);

  const mensajes = etapa==="primero" ? mensajesPrimero
    : etapa==="segundo" ? MENSAJES_SEGUNDO_CONTACTO
    : etapa==="tercero" ? MENSAJES_TERCER_CONTACTO
    : etapa==="datos" ? MENSAJES_PEDIDO_DATOS
    : etapa==="promo" ? MENSAJES_PROMO_BRONZEN
    : mensajesViaje;

  const NOMBRE_ETAPA = {
    primero: "Primer contacto",
    segundo: "Segundo contacto",
    tercero: "Tercer contacto",
    datos: "Datos solicitados",
    viaje: "Notificación de viaje",
    promo: "Promo Bronzen",
  };

  function abrirMensaje(index, texto){
    if(!telSeleccionado) return;
    const numero = telSeleccionado.numero.replace(/[^0-9]/g,"");
    const url = `https://wa.me/54${numero}?text=${encodeURIComponent(texto)}`;
    window.open(url, "_blank", "noopener");
    setEnviados(prev=> new Set(prev).add(etapa+"_"+index));
    if(onRegistrarEnvio){
      onRegistrarEnvio({
        id: uid("ev"),
        fecha: new Date().toISOString(),
        tipo: "whatsapp",
        comentario: `${NOMBRE_ETAPA[etapa]} — Mensaje ${index+1} de ${mensajes.length}`,
      });
    }
  }

  function marcarDatosCompletos(){
    if(onMarcarDatosCompletos) onMarcarDatosCompletos(true);
    setEtapa("primero");
  }

  return (
    <div className="modal-overlay" style={{position:"fixed", inset:0, background:"rgba(10,20,35,0.5)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:70, padding:16}} onClick={onCerrar}>
      <div className="modal-box" style={{background:"#fff", borderRadius:14, padding:"24px 22px", width:480, maxWidth:"100%", maxHeight:"90vh", overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <h3 style={{marginTop:0, fontSize:17, fontWeight:700, marginBottom:2}}>Mensajes de contacto</h3>
        <p style={{fontSize:13, color:"var(--gris-500)", marginTop:0, marginBottom:16}}>{carpintero.nombre}</p>

        <div style={{display:"flex", gap:6, marginBottom:16, borderBottom:"1px solid var(--gris-200)", flexWrap:"wrap"}}>
          <button onClick={()=>setEtapa("primero")}
            style={{flex:"1 1 auto", padding:"9px 4px", border:"none", background:"none", fontSize:12.5, fontWeight:600,

          <button onClick={()=>setEtapa("viaje")}

          <button onClick={()=>setEtapa("promo")}

}

function ModalEnvioMasivo({carpinteros, onRegistrarEnvio, onCerrar}){
  const [indice, setIndice] = useState(0);
  const [etapa, setEtapa] = useState("primero"); // "primero" | "segundo" | "tercero" | "viaje"
  const [enviados, setEnviados] = useState(()=> new Set()); // claves: "carpinteroId_etapa_mensajeIndex"
  const [modoViaje, setModoViaje] = useState("esta_semana");
  const [diasViaje, setDiasViaje] = useState([]);

  const carpintero = carpinteros[indice];
  const telefono = carpintero?.telefonos?.[0]; // primer teléfono cargado, automático

  const mensajesPrimero = useMemo(()=> [
    {tipo:"whatsapp", texto: saludoSegunHora()},
    ...MENSAJES_PRIMER_CONTACTO,
  ], []);

  const mensajesViaje = useMemo(()=> [
    {tipo:"whatsapp", texto: saludoSegunHora()},
    {tipo:"whatsapp", texto: mensajeNotificacionViaje(modoViaje, diasViaje)},
  ], [modoViaje, diasViaje]);

  const mensajes = etapa==="primero" ? mensajesPrimero
    : etapa==="segundo" ? MENSAJES_SEGUNDO_CONTACTO
    : etapa==="tercero" ? MENSAJES_TERCER_CONTACTO
    : etapa==="promo" ? MENSAJES_PROMO_BRONZEN
    : mensajesViaje;

  const NOMBRE_ETAPA = {
    primero: "Primer contacto",
    segundo: "Segundo contacto",
    tercero: "Tercer contacto",
    viaje: "Notificación de viaje",
    promo: "Promo Bronzen",
  };

  function claveEnviado(i){ return `${carpintero.id}_${etapa}_${i}`; }

  function abrirMensaje(i, texto){
    if(!telefono) return;
    const numero = telefono.numero.replace(/[^0-9]/g,"");
    const url = `https://wa.me/54${numero}?text=${encodeURIComponent(texto)}`;
    window.open(url, "_blank", "noopener");
    setEnviados(prev=> new Set(prev).add(claveEnviado(i)));
    onRegistrarEnvio(carpintero.id, {
      id: uid("ev"),
      fecha: new Date().toISOString(),
      tipo: "whatsapp",
      comentario: `${NOMBRE_ETAPA[etapa]} — Mensaje ${i+1} de ${mensajes.length}`,
    });
  }

  function irASiguiente(){
    if(indice < carpinteros.length - 1){
      setIndice(i=>i+1);
    } else {
      onCerrar();
    }
  }

  function irAAnterior(){
    if(indice > 0) setIndice(i=>i-1);
  }

  if(!carpintero) return null;

  return (
    <div className="modal-overlay" style={{position:"fixed", inset:0, background:"rgba(10,20,35,0.5)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:70, padding:16}} onClick={onCerrar}>
      <div className="modal-box" style={{background:"#fff", borderRadius:14, padding:"24px 22px", width:480, maxWidth:"100%", maxHeight:"90vh", overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:2}}>
          <h3 style={{margin:0, fontSize:17, fontWeight:700}}>Envío masivo</h3>
          <span style={{fontSize:12.5, color:"var(--gris-500)", fontWeight:600}}>{indice+1} de {carpinteros.length}</span>
        </div>
        <p style={{fontSize:14, color:"var(--gris-800)", marginTop:6, marginBottom:2, fontWeight:700}}>{carpintero.nombre}</p>
        <p style={{fontSize:12.5, color:"var(--gris-500)", marginTop:0, marginBottom:16}}>
          {telefono ? (telefono.nombre ? `${telefono.nombre} — ${telefono.numero}` : telefono.numero) : "⚠️ Sin teléfono cargado"}
        </p>

        <div style={{display:"flex", gap:6, marginBottom:16, borderBottom:"1px solid var(--gris-200)", flexWrap:"wrap"}}>
          <button onClick={()=>setEtapa("primero")}
            style={{flex:"1 1 auto", padding:"9px 4px", border:"none", background:"none", fontSize:12.5, fontWeight:600,
              color: etapa==="primero" ? "var(--azul-600)" : "var(--gris-500)",
              borderBottom: etapa==="primero" ? "2px solid var(--azul-600)" : "2px solid transparent"}}>
            1️⃣ Primer contacto
          </button>
          <button onClick={()=>setEtapa("segundo")}
            style={{flex:"1 1 auto", padding:"9px 4px", border:"none", background:"none", fontSize:12.5, fontWeight:600,
              color: etapa==="segundo" ? "var(--azul-600)" : "var(--gris-500)",
              borderBottom: etapa==="segundo" ? "2px solid var(--azul-600)" : "2px solid transparent"}}>
            2️⃣ Cuando responda
          </button>
          <button onClick={()=>setEtapa("tercero")}
            style={{flex:"1 1 auto", padding:"9px 4px", border:"none", background:"none", fontSize:12.5, fontWeight:600,
              color: etapa==="tercero" ? "var(--azul-600)" : "var(--gris-500)",
              borderBottom: etapa==="tercero" ? "2px solid var(--azul-600)" : "2px solid transparent"}}>
            3️⃣ Le interesa Bronzen
          </button>
          <button onClick={()=>setEtapa("viaje")}
            style={{flex:"1 1 auto", padding:"9px 4px", border:"none", background:"none", fontSize:12.5, fontWeight:600,
              color: etapa==="viaje" ? "var(--azul-600)" : "var(--gris-500)",
              borderBottom: etapa==="viaje" ? "2px solid var(--azul-600)" : "2px solid transparent"}}>
            🚚 Notificación de viaje
          </button>
          <button onClick={()=>setEtapa("promo")}
            style={{flex:"1 1 auto", padding:"9px 4px", border:"none", background:"none", fontSize:12.5, fontWeight:600,
              color: etapa==="promo" ? "var(--azul-600)" : "var(--gris-500)",
              borderBottom: etapa==="promo" ? "2px solid var(--azul-600)" : "2px solid transparent"}}>
            🎁 Promo Bronzen
          </button>
        </div>

        {etapa==="viaje" && (
          <SelectorViaje modo={modoViaje} setModo={setModoViaje} diasElegidos={diasViaje} setDiasElegidos={setDiasViaje} />
        )}

        {!telefono && (
          <div style={{background:"var(--rojo-50)", border:"1px solid var(--rojo-500)", borderRadius:10, padding:12, marginBottom:14, fontSize:13, color:"var(--rojo-700)"}}>
            Este carpintero no tiene teléfono cargado. Tocá "Siguiente" para pasar al próximo, o cerrá y completá su teléfono desde "Editar".
          </div>
        )}

        <div style={{display:"flex", flexDirection:"column", gap:10}}>
          {mensajes.map((m, i)=>{
            const key = claveEnviado(i);
            const esRecordatorio = m.tipo === "recordatorio";
            return (
              <button key={key} disabled={!telefono} onClick={()=> !esRecordatorio && abrirMensaje(i, m.texto)}
                style={{textAlign:"left", padding:"12px 14px", borderRadius:10,
                  border: esRecordatorio ? "1px dashed var(--ambar-600)" : (enviados.has(key) ? "1px solid var(--verde-500)" : "1px solid var(--gris-200)"),
                  background: esRecordatorio ? "var(--ambar-100)" : (enviados.has(key) ? "var(--verde-50)" : "var(--gris-50)"),
                  fontSize:13.5, lineHeight:1.4, color:"var(--gris-800)", cursor: (esRecordatorio || !telefono) ? "default" : "pointer",
                  opacity: telefono ? 1 : 0.6}}>
                <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4}}>
                  <span style={{fontSize:11, fontWeight:700, color: esRecordatorio ? "var(--ambar-600)" : "var(--verde-700)"}}>
                    {esRecordatorio ? "📎 Recordatorio" : `Mensaje ${i+1} de ${mensajes.length}`}
                  </span>
                  {!esRecordatorio && enviados.has(key) && <span style={{fontSize:11, color:"var(--verde-600)", fontWeight:700}}>✓ Enviado</span>}
                </div>
                {m.texto}
              </button>
            );
          })}
        </div>

        <div style={{display:"flex", gap:10, marginTop:18}}>
          <button onClick={irAAnterior} disabled={indice===0}
            style={{flex:1, padding:"10px", borderRadius:8, border:"1px solid var(--gris-300)", background:"#fff", opacity: indice===0 ? 0.5 : 1}}>
            ← Anterior
          </button>
          <button onClick={irASiguiente}
            style={{flex:1, padding:"10px", borderRadius:8, border:"none", background:"var(--verde-600)", color:"#fff", fontWeight:600}}>
            {indice < carpinteros.length-1 ? "Siguiente →" : "Terminar"}
          </button>
        </div>
        <div style={{marginTop:10}}>
          <button onClick={onCerrar} style={{width:"100%", padding:"9px", borderRadius:8, border:"none", background:"none", color:"var(--gris-500)", fontSize:12.5}}>
            Cerrar sin terminar
          </button>
        </div>
      </div>
    </div>
  );
}

// Combo para elegir un comentario ya usado antes, o escribir uno nuevo.
// value/onChange funcionan como un input de texto normal para quien lo usa por fuera.
const NUEVA_NOTA = "__nueva_nota__";

function ComboComentario({value, onChange, comentariosPrevios, placeholder}){
  const [modoNuevo, setModoNuevo] = useState(!value || !comentariosPrevios.includes(value));

  function manejarSelect(e){
    const v = e.target.value;
    if(v === NUEVA_NOTA){
      setModoNuevo(true);
      onChange("");
    } else {
      setModoNuevo(false);
      onChange(v);
    }
  }

  if(comentariosPrevios.length === 0 || modoNuevo){
    return (
      <div>
        <textarea value={value} onChange={e=>onChange(e.target.value)} rows={2}
          style={{...inputStyle, resize:"vertical"}} placeholder={placeholder} />
        {comentariosPrevios.length > 0 && (
          <button type="button" onClick={()=>setModoNuevo(false)}
            style={{fontSize:12, color:"var(--azul-600)", background:"none", border:"none", padding:"4px 0 0 0"}}>
            ← Elegir una nota ya usada
          </button>
        )}
      </div>
    );
  }

  return (
    <select value={value} onChange={manejarSelect} style={inputStyle}>
      <option value="">Sin comentario</option>
      {comentariosPrevios.map(c=> <option key={c} value={c}>{c}</option>)}
      <option value={NUEVA_NOTA}>✎ Escribir nueva nota...</option>
    </select>
  );
}

function Campo({label, children}){
  return (
    <div style={{marginBottom:14}}>
      <label style={{display:"block", fontSize:12.5, color:"var(--gris-700)", marginBottom:5, fontWeight:600}}>{label}</label>
      {children}
    </div>
  );
}

const inputStyle = {width:"100%", padding:"9px 11px", borderRadius:7, border:"1px solid var(--gris-300)", fontSize:14};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
